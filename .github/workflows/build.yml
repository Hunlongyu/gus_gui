name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64 -skip-installer -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: gus-windows-amd64-dev
          path: dist/windows-amd64/gus.exe
          if-no-files-found: error
