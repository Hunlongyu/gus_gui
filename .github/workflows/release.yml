name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag to publish (for example v1.2.3)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content -Raw mygo.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or "v$version" -cne $env:RELEASE_TAG) { throw 'Tag and stable version must match' }
      - run: go test -count=1 ./...
      - run: go vet ./...
      - name: Package the entry point used by older installations
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o resources/windows-amd64/GitUserSwitch.exe ./cmd/legacy-launcher
      - name: Build installer and signed update
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if (!$env:MYGO_UPDATER_PRIVATE_KEY) { throw 'Missing update signing secret' }
          go run github.com/egoist/mygo/cmd/mygo build -platform windows/amd64
      - name: Verify signed archive against embedded public key
        env:
          GUS_VERIFY_RELEASE: '1'
        run: go test -count=1 -run '^TestSignedReleaseArchive$' .
      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/publish.ps1
